name: Action speed regression checks
on:
  pull_request:
    paths: ['action-speed/**', '.github/workflows/action-speed.yml']
  push:
    branches: [main]
    paths: ['action-speed/**', '.github/workflows/action-speed.yml']
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: action-speed
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run JavaScript regression checks
        run: node --test tests/*.test.cjs
      - name: Check browser script syntax
        run: |
          node --check src/CrockdHelpScoutFolders/quick-close.js
          node --check src/InboxShortcuts/Resources/assets/inbox-shortcuts.js
          node --check src/UnSub/Resources/assets/unsub.js
      - name: Run isolated PHP checks
        run: |
          php tests/status-controller.php
          php tests/counter-middleware.php
          php -l src/UnSub/Http/Controllers/UnsubscribeController.php
          php -l src/InboxSpeed/Middleware.php
